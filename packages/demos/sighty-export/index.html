<!doctype html>
<html id="sighty-export-document" lang="fr">
  <head id="sighty-export-head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sighty — paquet exporté Demo 5</title>
  </head>
  <body id="sighty-export-body">
    <main id="sighty-export-main">
      <header id="sighty-export-header">
        <h1 id="sighty-export-title">Cours Demo 5 chargé depuis un paquet Sighty</h1>
        <p id="sighty-export-status" role="status" aria-live="polite">Chargement du paquet autonome…</p>
        <p id="sighty-export-log" aria-live="polite"></p>
      </header>
      <section id="sighty-export-viewport" aria-label="Cours Demo 5 exporté">
        <div id="sighty-export-root"></div>
      </section>
      <footer id="sighty-export-footer">
        <button id="sighty-export-initialize" type="button" disabled>Initialiser le cours</button>
        <section id="sighty-export-remote-panel" class="sighty-layout__remote" aria-label="Lecture du cours">
          <div id="sighty-export-remote"></div>
        </section>
      </footer>
    </main>
    <script id="sighty-export-entry" type="module" src="./main.ts"></script>
  </body>
</html>
