<!doctype html>
<html id="scene-export-document" lang="fr">
  <head id="scene-export-head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>CodPlay — export de la démo preload-media</title>
  </head>
  <body id="scene-export-body">
    <main id="scene-export-main">
      <h1 id="scene-export-title">Export de la démo V2 « Preload média »</h1>
      <p id="scene-export-status" role="status">Chargement du paquet exporté…</p>
      <div id="scene-export-stage" aria-label="Deux occurrences de la scène de diffusion">
        <section id="scene-export-occurrence-a" class="scene-export-occurrence">
          <h2 id="scene-export-instance-a-title">Occurrence A</h2>
          <p id="scene-export-instance-a-status" role="status">Chargement…</p>
          <div id="scene-root-a" class="scene-export-root"></div>
        </section>
        <section id="scene-export-occurrence-b" class="scene-export-occurrence">
          <h2 id="scene-export-instance-b-title">Occurrence B</h2>
          <p id="scene-export-instance-b-status" role="status">Chargement…</p>
          <div id="scene-root-b" class="scene-export-root"></div>
        </section>
      </div>
      <div id="scene-export-controls" aria-label="Commandes de diffusion">
        <button id="scene-export-play" type="button" disabled>Lancer A et B</button>
        <button id="scene-export-pause-a" type="button" disabled>Pause A</button>
        <button id="scene-export-seek-a" type="button" disabled>Seek A au milieu de la vidéo (timeline à 5 000 ms)</button>
        <button id="scene-export-destroy-a" type="button" disabled>Détruire A</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
