<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POC tête parlante Elcé</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #17202a; background: #f3f5f8; }
      body { margin: 0; }
      #talking-head-mcp-main { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 0.75rem; height: 100dvh; padding: 0.75rem; box-sizing: border-box; }
      #talking-head-mcp-heading { margin: 0; font-size: 1.1rem; }
      #talking-head-mcp-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
      #talking-head-mcp-controls button { min-height: 2.25rem; }
      #talking-head-mcp-seek { flex: 1 1 12rem; }
      #talking-head-mcp-stage { min-width: 0; min-height: 0; overflow: hidden; background: #fff; }
      #talking-head-mcp-status { min-height: 1.4em; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main id="talking-head-mcp-main">
      <h1 id="talking-head-mcp-heading">POC tête parlante Elcé</h1>
      <nav id="talking-head-mcp-controls" aria-label="Commandes de validation">
        <button id="talking-head-mcp-play" type="button">Lecture</button>
        <button id="talking-head-mcp-pause" type="button">Pause</button>
        <button id="talking-head-mcp-seek-back" type="button">Revenir à 1 s</button>
        <button id="talking-head-mcp-seek-forward" type="button">Aller à 7,5 s</button>
        <input id="talking-head-mcp-seek" type="range" min="0" max="14446" step="1" value="0" aria-label="Position de la voix" />
        <button id="talking-head-mcp-destroy" type="button">Détruire</button>
      </nav>
      <section id="talking-head-mcp-stage" aria-label="Scène Elcé"></section>
      <output id="talking-head-mcp-status" role="status" aria-live="polite">Chargement…</output>
    </main>
    <script type="module" src="/src/mods/learning/integration/browser/rive-talking-avatar-poc-mcp.ts"></script>
  </body>
</html>
